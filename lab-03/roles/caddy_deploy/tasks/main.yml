---
- name: Установить зависимости
  ansible.builtin.apt:
    name: [debian-keyring, debian-archive-keyring, apt-transport-https, curl, gnupg]
    update_cache: true
    state: present

- name: Загрузить ключ репозитория Caddy
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable.asc
    mode: '0644'

- name: Добавить репозиторий Caddy
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    filename: caddy-stable
    state: present

- name: Установить Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Создать каталоги сайта и логов
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ site_root }}"
    - /var/log/caddy

- name: Скопировать свою страницу
  ansible.builtin.copy:
    src: index.html
    dest: "{{ site_root }}/index.html"
    mode: '0644'

- name: Создать конфигурацию из шаблона
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    validate: caddy validate --config %s --adapter caddyfile
  notify: Перезагрузить конфигурацию Caddy

- name: Проверить процесс Caddy
  ansible.builtin.command: pgrep -x caddy
  register: caddy_process
  changed_when: false
  failed_when: caddy_process.rc not in [0, 1]

- name: Запустить Caddy в контейнере
  ansible.builtin.command: caddy start --config /etc/caddy/Caddyfile
  when: caddy_process.rc == 1
