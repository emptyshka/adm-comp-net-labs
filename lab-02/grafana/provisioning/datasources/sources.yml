apiVersion: 1
datasources:
  - name: Loki
    uid: nextcloud-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 200
  - name: Zabbix
    uid: nextcloud-zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
      trends: false
      cacheTTL: 10s
      timeout: 10
    secureJsonData:
      password: $ZABBIX_PASSWORD
